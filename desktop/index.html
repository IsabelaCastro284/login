
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/3ba5d0a0fa.js" crossorigin="anonymous"></script>
    <title>Login</title>
</head>
<body>
    <main>
        <!-- Painel vermelho -->
        <section class="painel-boas-vindas">
            <div class="marca">
                <span class="logo"></span>
            </div>
            <div class="conteudo-boas-vindas">
                <h1>
                    Bem-vindo<br>
                    de volta
                </h1>
                <p>Entre para acessar sua conta e continuar de onde parou.
                </p>
            </div>
            <footer>
                NOVEMBRO 2026
            </footer>
        </section>

        <!-- Painel de login -->
        <section class="painel-login">

            <h1 class="texto-entrar-com">
                Entrar com
            </h1>
            <div class="icones-redes-sociais">
                <a href="#" aria-label="Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>
                <a href="#" aria-label="Google">
                    <i class="fa-brands fa-google"></i>
                </a>
                <a href="#" aria-label="LinkedIn">
                    <i class="fa-brands fa-linkedin-in"></i>
                </a>
            </div>
            <p class="texto-usar-conta"> ou utilize sua conta </p>
            <form class="formulario-login">
                <input
                    type="email"
                    placeholder="Email"
                    required>
                <input
                    type="password"
                    placeholder="Senha"
                    required>
                <a href="#" class="texto-esqueci-senha"> Esqueceu a senha?</a>
                <button type="submit" class="logar">
                    LOGAR
                </button>
            </form>
            <div class="cadastre-se">
                <p>
                    Não tem conta?
                    <a href="#">Registre-se</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
