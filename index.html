<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/3ba5d0a0fa.js" crossorigin="anonymous"></script>
    <title>Login</title>
</head>
<body>
    <main>
        <h1 class="texto-entrar-com">
            Entrar com
        </h1>
        <div class="icones-redes-sociais">
            <a href="#">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="#">
                <i class="fa-brands fa-google"></i>
            </a>
            <a href="#">
                <i class="fa-brands fa-linkedin-in"></i>
            </a>
        </div>
        <p class="texto-usar-conta">
            ou utilize sua conta
        </p>
        <form class="formulario-login">
            <input
                type="email"
                placeholder="Email"
                required 
            >
            <input
                type="password"
                placeholder="Senha"
                required
            >
        </form>
        <p class="texto-esqueci-senha">
            Esqueceu a senha?
        </p>
        <!-- Botão de login -->
        <a href="#" class="logar">
            LOGAR
        </a>
        <div class="cadastre-se">
            <p>
                Não tem conta?
                <a href="#">Registre-se</a>
            </p>
        </div>
    </main>
</body>
</html>
